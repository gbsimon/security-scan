# Self-check for the scanner itself.
name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Byte-compile
        run: python3 -m py_compile scanner/scan.py

      # The fixtures under tests/fixtures/positive/ are REAL malware samples,
      # defanged by the .SAMPLE.txt suffix. Nothing in this job installs npm
      # packages or executes any scanned file; the scanner only reads bytes.
      - name: Run the fixture suite
        run: python3 scanner/scan.py selftest

      - name: Scan this repo with itself
        run: |
          python3 scanner/scan.py tree . --fail-on HIGH --github
